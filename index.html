<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- FONT -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- TAILWIND -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- STYLES -->
    <link rel="stylesheet" href="./styles/header.css" />
    <link rel="stylesheet" href="./styles/btn.css" />
    <link rel="stylesheet" href="./styles/input.css" />
    <link rel="stylesheet" href="./styles/select.css" />
    <link rel="stylesheet" href="./styles/style.css" />
    <!-- SCRIPT -->
    <script src="./app.js" defer></script>
    <title>Task Management App</title>
  </head>
  <body class="min-h-screen flex justify-center items-center">
    <main class="w-full flex justify-center items-center">
      <div class="container p-6">
        <!-- HEADER -->
        <header class="header flex justify-between items-center mb-10">
          <!-- LOGO -->
          <div class="flex items-center gap-2">
            <svg class="icon-big" aria-hidden="true">
              <use href="./assets/sprite.svg#icon-square-check" />
            </svg>
            <div class="flex flex-col align-center">
              <h1 class="text-3xl font-bold">Task Manager</h1>
              <p>Add, track and orgonize your tasks</p>
            </div>
          </div>
          <!-- BOARD -->
          <div class="task__board border border-neutral-400 p-2 rounded-2xl">
            <ul class="task__board-list flex gap-4">
              <li class="task__board-list-item flex flex-col items-center min-w-22">
                <div class="task__category">All</div>
                <div class="task__count text-xl font-bold">6</div>
              </li>
              <li class="task__board-list-item flex flex-col items-center min-w-22">
                <div class="task__category">In Progress</div>
                <div class="task__count text-xl font-bold text-amber-600">2</div>
              </li>
              <li class="task__board-list-item flex flex-col items-center min-w-22">
                <div class="task__category">Completed</div>
                <div class="task__count text-xl font-bold text-green-700">3</div>
              </li>
              <li class="task__board-list-item flex flex-col items-center min-w-22">
                <div class="task__category">Overdue</div>
                <div class="task__count text-xl font-bold text-red-600">1</div>
              </li>
            </ul>
          </div>
        </header>
        <section class="add-task p-6 bg-white rounded-2xl shadow-xl">
          <h2 class="text-lg font-bold mb-3">Add New Task</h2>
          <form class="grid grid-cols-[6fr_1fr_1fr_1fr_auto] gap-4 items-center">
            <!-- TASK NAME -->
            <div class="flex flex-col gap-1">
              <label for="task-name" class="text-sm font-semibold">Task Name</label>
              <input
                id="task-name"
                name="task-name"
                type="text"
                required
                placeholder="e.g. Join Zoom"
                class="h-10 w-full rounded-xl border border-neutral-400 bg-white text-sm px-3"
              />
            </div>
            <!-- CATEGORY -->
            <div class="flex flex-col gap-1">
              <label for="category" class="text-sm font-semibold">Category</label>
              <div class="relative">
                <select
                  id="category"
                  name="category"
                  class="h-10 w-full rounded-xl border border-neutral-400 bg-white text-sm select px-3 pr-10"
                >
                  <option value="health">Health</option>
                  <option value="personal">Personal</option>
                  <option value="study">Study</option>
                  <option value="travel">Travel</option>
                  <option value="work">Work</option>
                </select>
                <svg
                  class="icon pointer-events-none absolute right-3 top-1/2 size-4 -translate-y-1/2 text-neutral-400"
                  aria-hidden="true"
                >
                  <use href="./assets/sprite.svg#icon-chevron-down" />
                </svg>
              </div>
            </div>
            <!-- DEADLINE -->
            <div class="flex flex-col gap-1">
              <label for="deadline" class="text-sm font-semibold">Deadline</label>
              <input
                id="deadline"
                name="deadline"
                type="date"
                class="h-10 w-full rounded-xl border border-neutral-400 bg-white text-sm px-3"
              />
            </div>
            <!-- STATUS -->
            <div class="flex flex-col gap-1">
              <label for="status" class="text-sm font-semibold">Status</label>
              <div class="relative">
                <select
                  id="status"
                  name="status"
                  class="h-10 w-full rounded-xl border border-neutral-400 bg-white text-sm select px-3 pr-10"
                >
                  <option value="completed">Completed</option>
                  <option value="progress">In Progress</option>
                  <option value="overdue">Overdue</option>
                </select>
                <svg
                  class="icon pointer-events-none absolute right-3 top-1/2 size-4 -translate-y-1/2 text-neutral-400"
                  aria-hidden="true"
                >
                  <use href="./assets/sprite.svg#icon-chevron-down" />
                </svg>
              </div>
            </div>
            <!-- BUTTON -->
            <button class="btn flex justify-center items-center gap-2 p-5 rounded-[10px] h-12 font-semibold self-end">
              <svg class="icon-plus" aria-hidden="true">
                <use href="./assets/sprite.svg#icon-plus" />
              </svg>
              <span>Add Task</span>
            </button>
          </form>
        </section>
      </div>
    </main>
  </body>
</html>
